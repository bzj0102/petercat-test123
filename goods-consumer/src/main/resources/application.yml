server:
  port: 8896
spring:
  application:
    name: goods-consumer
  thymeleaf:
    cache: false
    prefix: classpath:/template/
    suffix: .html
    encoding: UTF-8
  mvc:
    static-path-pattern: /template/**zh

eureka:
  client:
    service-url:
      defaultZone: http://root:123456@localhost:8500/eureka/
    instance:
      hostname: localhost
feign:
  hystrix:
    enabled: true


