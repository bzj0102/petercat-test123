server:
  port: 8893  #服务端口
spring:
  application:
    name: user-consumer   #服务名
  thymeleaf:
    cache: false      #关闭缓存
    prefix: classpath:/template/
    suffix: .html
    encoding: UTF-8
  mvc:
    static-path-pattern: /template/**

eureka:
  client:
    service-url:
      defaultZone: http://root:123456@localhost:8500/eureka/  #服务注册地址
  instance:
    hostname: localhost

feign:
   hystrix:
     enabled: true